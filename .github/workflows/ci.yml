name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check local runtime
        run: npm run doctor

      - name: Describe MCP surface
        run: npm run mcp:describe

      - name: Audit package contents
        run: npm pack --dry-run

  verify-selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analyzer dependencies
        run: pip install numpy pillow

      - name: Analyzer scores known synthetic answers (incl. negative cases)
        run: python verify/selftest.py

      - name: Driver parses
        run: node --check verify/drive.mjs
